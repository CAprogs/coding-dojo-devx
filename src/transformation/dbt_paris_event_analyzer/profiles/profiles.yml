dbt_paris_event_analyzer:
  outputs:
    # Real data: reads today's snapshot written by `just ingest` into datalake/
    prod:
      type: duckdb
      path: warehouse/prod.duckdb
      threads: 4
      extensions:
        - parquet
        - spatial
    # Offline and CI: reads the generated sample in data/sample/ (see `just sample`)
    ci:
      type: duckdb
      path: warehouse/ci.duckdb
      threads: 4
      extensions:
        - parquet
        - spatial
    # SQLFluff templating only: nothing is read or written
    lint:
      type: duckdb
      path: ":memory:"
      threads: 1

  target: prod
